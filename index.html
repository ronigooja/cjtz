<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff5eb" />
  <meta name="description" content="超级兔子地址发布页" />
  <title>超级兔子 · 地址发布页</title>
  <style>
    :root {
      --ink: #262626;
      --muted: #6f6f6f;
      --orange: #f38020;
      --orange-deep: #d96612;
      --orange-soft: #fff0e3;
      --line: rgba(255, 255, 255, .86);
      --glass: rgba(255, 255, 255, .7);
      --shadow: 0 30px 90px rgba(120, 67, 25, .15);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 4% 0%, rgba(255, 190, 126, .42), transparent 28%),
        radial-gradient(circle at 100% 10%, rgba(255, 226, 193, .58), transparent 25%),
        linear-gradient(145deg, #fff5eb 0%, #fffdf9 54%, #fff1e4 100%);
      overflow-x: hidden;
      overflow-y: scroll;
    }

    body::before, body::after {
      position: fixed;
      z-index: -1;
      display: block;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      content: "";
      filter: blur(2px);
      opacity: .4;
      pointer-events: none;
    }
    body::before { top: 42%; left: -150px; background: #ffd4aa; }
    body::after { right: -150px; bottom: 4%; background: #f5bd83; }

    .page {
      width: min(100% - 32px, 520px);
      margin: 0 auto;
      padding: 30px 0 180px;
    }

    .shell {
      position: relative;
      overflow: hidden;
      padding: 22px 18px 20px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 34px;
      background: linear-gradient(150deg, rgba(255,255,255,.57), rgba(255,255,255,.3));
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px) saturate(130%);
      -webkit-backdrop-filter: blur(22px) saturate(130%);
    }
    .shell::before {
      position: absolute;
      top: -78px;
      right: -52px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .48);
      content: "";
    }

    header { position: relative; text-align: center; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 18px;
      padding: 7px 11px;
      border: 1px solid rgba(243, 128, 32, .18);
      border-radius: 999px;
      color: var(--orange-deep);
      background: rgba(255,255,255,.48);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .eyebrow::before { width: 6px; height: 6px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 4px rgba(243,128,32,.14); content: ""; }
    .logo-wrap {
      display: grid;
      place-items: center;
      width: 86px;
      height: 86px;
      margin: 0 auto 19px;
      border: 5px solid rgba(255,255,255,.86);
      border-radius: 28px;
      background: rgba(255,255,255,.52);
      box-shadow: 0 17px 36px rgba(180, 91, 24, .2), 0 0 0 8px rgba(255,255,255,.2);
    }
    .logo {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 21px;
      object-fit: cover;
    }
    h1 { margin: 0; font-size: clamp(25px, 7vw, 32px); font-weight: 750; letter-spacing: .015em; }
    .subtitle { margin: 10px 0 0; color: var(--muted); font-size: 13px; letter-spacing: .16em; }

    .address-list { display: grid; gap: 13px; margin: 32px 0 25px; }
    .address-card {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 78px;
      padding: 13px 13px 13px 15px;
      border: 1px solid rgba(255,255,255,.78);
      border-radius: 20px;
      color: inherit;
      text-decoration: none;
      background: linear-gradient(110deg, rgba(255,255,255,.79), rgba(255,255,255,.47));
      box-shadow: 0 12px 26px rgba(53, 129, 113, .075), inset 0 1px 0 rgba(255,255,255,.72);
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .address-card:active { transform: scale(.985); }
    @media (hover: hover) {
      .address-card:hover { transform: translateY(-2px); background: rgba(255,255,255,.82); box-shadow: 0 14px 28px rgba(53,129,113,.13); }
    }
    .site-icon {
      display: grid;
      flex: 0 0 43px;
      place-items: center;
      width: 45px;
      height: 45px;
      border-radius: 15px;
      color: white;
      font-weight: 700;
      background: linear-gradient(140deg, #ffb36f, #f38020);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.42), 0 7px 15px rgba(243,128,32,.24);
    }
    .address-info { min-width: 0; flex: 1; }
    .address-label { margin-bottom: 5px; color: var(--muted); font-size: 11px; letter-spacing: .05em; }
    .address-url { overflow: hidden; color: var(--ink); font-size: 15px; font-weight: 650; letter-spacing: -.01em; text-overflow: ellipsis; white-space: nowrap; }
    .arrow { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: var(--orange-deep); background: rgba(243,128,32,.12); font-size: 22px; font-weight: 300; line-height: 1; }

    .tip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .tip-dot { width: 6px; height: 6px; border-radius: 99px; background: var(--orange); }
    footer { margin-top: 29px; color: rgba(86, 68, 55, .68); font-size: 10px; text-align: center; letter-spacing: .18em; text-transform: uppercase; }

    @media (min-width: 600px) {
      .page { padding-top: 72px; }
      .shell { padding: 28px 34px 26px; }
    }
    @media (prefers-reduced-motion: reduce) { .address-card { transition: none; } }

    .card-fold { position: relative; height: 0; margin-top: 8px; overflow: hidden; pointer-events: none; contain: layout paint; }
    .card-fold.is-open { height: auto; aspect-ratio: 85.6 / 53.98; }
    .card-fold .promo-card { position: absolute; inset: 0; width: 100%; height: 100%; aspect-ratio: auto; opacity: 0; transform: translateY(-8px) scale(.985); pointer-events: none; transition: opacity .22s ease, transform .32s cubic-bezier(.22,.61,.36,1); will-change: opacity, transform; }
    .card-fold.is-open .promo-card { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .card-fold summary { display:flex; align-items:center; justify-content:center; min-height:44px; padding:11px 16px; border:1px solid rgba(255,255,255,.82); border-radius:14px; color:var(--orange-deep); background:rgba(255,255,255,.48); box-shadow:0 8px 18px rgba(120,67,25,.08); cursor:pointer; font-size:12px; font-weight:700; list-style:none; }
    .card-fold summary::-webkit-details-marker { display:none; }
    .card-fold summary::after { margin-left:8px; content:"⌄"; font-size:18px; line-height:1; }
    .card-fold[open] summary::after { transform:rotate(180deg); }
    .source-dialog[hidden] { display:none; }
    .source-dialog { position:fixed; z-index:20; inset:0; display:grid; place-items:center; padding:20px; background:rgba(38,38,38,.32); }
    .source-dialog-panel { width:min(100%,360px); padding:22px; border:1px solid rgba(255,255,255,.9); border-radius:22px; background:#fffaf5; box-shadow:0 24px 70px rgba(72,42,20,.24); }
    .source-dialog-title { margin:0; color:var(--ink); font-size:18px; font-weight:750; }
    .source-dialog-desc { margin:8px 0 15px; color:var(--muted); font-size:12px; line-height:1.6; }
    .source-dialog-input { width:100%; padding:11px 12px; border:1px solid rgba(217,102,18,.28); border-radius:12px; outline:none; color:var(--ink); background:#fff; font:inherit; }
    .source-dialog-input:focus { border-color:var(--orange); box-shadow:0 0 0 3px rgba(243,128,32,.14); }
    .source-dialog-error { min-height:18px; margin:7px 0 0; color:#c44c22; font-size:11px; }
    .source-dialog-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:10px; }
    .source-dialog-actions button { padding:9px 15px; border:0; border-radius:10px; cursor:pointer; font:inherit; font-size:12px; font-weight:700; }
    .source-dialog-cancel { color:var(--muted); background:rgba(111,111,111,.1); }
    .source-dialog-confirm { color:#fff; background:var(--orange); }
    .download { position:absolute; top:12px; right:12px; display:grid; place-items:center; width:30px; height:30px; border:0; border-radius:50%; color:#fff; background:rgba(243,128,32,.9); box-shadow:0 6px 14px rgba(201,92,13,.22); cursor:pointer; opacity:.88; transition:opacity .2s ease, transform .2s ease; }
    .download:hover, .download:focus-visible { opacity:1; transform:translateY(-1px); }
    .download svg { width:15px; height:15px; }
    .promo-card { position:relative; aspect-ratio:85.6/53.98; padding:0; border:1px solid #292726; border-radius:20px; background:linear-gradient(145deg,#2b2723 0%,#1e1b18 100%); color:#fff; overflow:hidden; }
    .promo-card::before { position:absolute; right:-82px; bottom:-118px; width:275px; height:275px; border:1px solid rgba(239,101,27,.24); border-radius:50%; content:""; }
    .promo-card::after { position:absolute; top:0; right:0; width:30%; height:3px; background:#f16b20; content:""; }
    .promo-brand-block { position:absolute; z-index:1; top:13%; left:8%; display:flex; align-items:center; gap:9px; }
    .promo-logo { width:15%; min-width:15%; aspect-ratio:1; border-radius:24%; object-fit:cover; }
    .promo-brand { font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif; font-size:clamp(17px,4.6vw,25px); font-weight:850; letter-spacing:.045em; }
    .promo-vpn { margin-top:1px; color:#f16b20; font-size:clamp(7px,1.9vw,10px); font-weight:850; letter-spacing:.16em; }
    .promo-copy { position:absolute; z-index:1; top:calc(47% + 5px); left:8%; width:52%; }
    .promo-copy::before { display:block; width:28px; height:2px; margin-bottom:9px; background:#f16b20; content:""; }
    .promo-tagline { position:static; max-width:none; margin:0; font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif; font-size:clamp(15px,4vw,22px); font-weight:900; letter-spacing:.08em; white-space:nowrap; }
    .promo-desc { position:static; max-width:none; margin-top:6px; color:#b2a79e; font-size:clamp(8.5px,2.1vw,11.5px); font-weight:600; letter-spacing:.055em; white-space:nowrap; }
    .promo-services { position:absolute; z-index:1; top:calc(69% + 14px); left:8%; display:flex; align-items:center; gap:6px; width:44%; opacity:.94; }
    .promo-services img { display:block; width:calc((100% - 48px) / 9); aspect-ratio:1; border-radius:18%; object-fit:contain; filter:brightness(1.08) contrast(1.08) saturate(1.06); }
    .promo-qr { position:absolute; z-index:1; right:8%; top:21%; display:grid; justify-items:center; width:22%; }
    .promo-qr::before { margin-bottom:6px; color:#f16b20; content:"扫码进入官网"; font-size:clamp(7px,1.7vw,9px); font-weight:800; letter-spacing:.12em; }
    .promo-qr .qr-wrap { position:static; display:grid; gap:4px; justify-items:center; padding:6px; border-radius:5px; background:#fff; overflow:hidden; }
    .promo-qr .qr-wrap img { display:block; width:clamp(51px,14vw,73px); aspect-ratio:1; }
    .promo-url { position:static; margin-top:6px; color:#fff; font-size:clamp(7px,1.8vw,10px); font-weight:800; letter-spacing:.04em; }
    .promo-tg { position:absolute; z-index:1; right:8%; bottom:calc(16% + 20px); width:22%; color:#ffe0cc; font-size:clamp(7px,1.65vw,9px); font-weight:750; letter-spacing:.06em; text-align:center; }
    @media print {
      @page { size: 85.6mm 53.98mm; margin: 0; }
      body { min-width: 85.6mm; background: #fff; }
      body > *:not(.page) { display:none !important; }
      .page { width: 85.6mm; margin: 0; padding: 0; }
      .shell { width: 85.6mm; padding: 0; border: 0; border-radius: 0; box-shadow: none; background: transparent; }
      .shell > *:not(.address-list) { display:none !important; }
      .address-list { display:block; margin: 0; }
      .address-entry > .address-card, .address-entry > .card-fold > summary { display:none !important; }
      .card-fold, .card-fold .promo-card { display:block !important; opacity:1 !important; transform:none !important; }
      .card-fold { height:auto; aspect-ratio: 85.6 / 53.98; margin:0; }
      .promo-card { width:85.6mm; height:53.98mm; border:0; border-radius:0; }
      .download { display:none !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card-fold .promo-card { transition: none; transform: none; }
    }

  </style>
</head>
<body>
  <main class="page">
    <section class="shell" aria-labelledby="page-title">
      <header>
        <div class="eyebrow">Official access</div>
        <div class="logo-wrap">
          <img class="logo" src="assets/img/logo.jpg" alt="超级兔子 logo" />
        </div>
        <h1 id="page-title">超级兔子</h1>
        <p class="subtitle">最新地址发布页</p>
      </header>

      <!-- 后续新增地址时，复制一个 .address-card 并修改 href、label 与 URL 即可 -->
      <nav class="address-list" aria-label="网站地址列表">
        <div class="address-entry">
          <a class="address-card" href="https://surabbit.com" target="_blank" rel="noopener noreferrer">
            <span class="site-icon" aria-hidden="true">S</span>
            <span class="address-info">
              <span class="address-label">主站地址</span>
              <span class="address-url">https://surabbit.com</span>
            </span>
            <span class="arrow" aria-hidden="true">›</span>
          </a>

          <div class="card-fold" id="promoFold" aria-hidden="true" inert>
            <div class="promo-card" aria-label="超级兔子宣传卡片">
              <div class="promo-brand-block"><img class="promo-logo" src="assets/img/logo.jpg" alt="超级兔子 logo" /><div><div class="promo-brand">超级兔子</div><div class="promo-vpn">GLOBAL ACCESS</div></div></div>
              <div class="promo-copy"><div class="promo-tagline">连接全球精彩内容</div><div class="promo-desc">AI 工具 · 流媒体 · 海外平台</div></div>
              <div class="promo-services" aria-label="支持的平台"><img src="assets/img/chatgpt.png" alt="ChatGPT" /><img src="assets/img/claude.png" alt="Claude" /><img src="assets/img/google.png" alt="Google" /><img src="assets/img/instagram.png" alt="Instagram" /><img src="assets/img/netflix.png" alt="Netflix" /><img src="assets/img/shopify.png" alt="Shopify" /><img src="assets/img/tiktok.png" alt="TikTok" /><img src="assets/img/x.png" alt="X" /><img src="assets/img/youtube.png" alt="YouTube" /></div>
              <div class="promo-qr"><div class="qr-wrap"><img id="qrImage" alt="官网二维码" /></div><div class="promo-url">surabbit.com</div></div><div class="promo-tg">TG：@cjtzpd</div>
              <button class="download" id="downloadCard" type="button" aria-label="下载宣传卡片" title="下载宣传卡片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
            </div>
          </div>
        </div>
      </nav>

      <p class="tip"><span class="tip-dot" aria-hidden="true"></span>点击卡片即可访问，请收藏本页面</p>
      <footer>Keep it simple · Stay connected</footer>
    </section>
  </main>
  <div class="source-dialog" id="sourceDialog" role="dialog" aria-modal="true" aria-labelledby="sourceDialogTitle" hidden>
    <form class="source-dialog-panel" id="sourceForm">
      <h2 class="source-dialog-title" id="sourceDialogTitle">设置宣传渠道</h2>
      <p class="source-dialog-desc">输入渠道标识，例如 store_a、agent_zhang。二维码会加入对应的 utm_source。</p>
      <input class="source-dialog-input" id="sourceInput" name="utm_source" autocomplete="off" maxlength="64" placeholder="例如：store_a" required />
      <p class="source-dialog-error" id="sourceError" aria-live="polite"></p>
      <div class="source-dialog-actions">
        <button class="source-dialog-cancel" id="sourceCancel" type="button">取消</button>
        <button class="source-dialog-confirm" type="submit">生成宣传卡</button>
      </div>
    </form>
  </div>
  <script src="scripts/qrcode.js"></script>
  <script src="scripts/qrcode_UTF8.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script>
    const baseAddress='https://surabbit.com', qrImage=document.getElementById('qrImage');
    let currentSource='';
    const updateQr=source=>{
      const target=new URL(baseAddress);
      if(source) target.searchParams.set('utm_source',source);
      const nextQr=qrcode(0,'M');
      nextQr.addData(target.toString());
      nextQr.make();
      qrImage.src=nextQr.createDataURL(4,0);
    };
    updateQr('');
    const addressCard=document.querySelector('.address-card'), promoFold=document.getElementById('promoFold');
    const publishPageAddress=new URL(baseAddress);
    publishPageAddress.searchParams.set('utm_source',window.location.hostname);
    addressCard.href=publishPageAddress.toString();
    const sourceDialog=document.getElementById('sourceDialog'), sourceForm=document.getElementById('sourceForm'), sourceInput=document.getElementById('sourceInput'), sourceError=document.getElementById('sourceError'), sourceCancel=document.getElementById('sourceCancel');
    let longPressTimer, longPressTriggered=false;
    const setPromoOpen=open=>{
      promoFold.setAttribute('aria-hidden',String(!open));
      promoFold.inert=!open;
      promoFold.classList.toggle('is-open',open);
    };
    const openSourceDialog=()=>{
      sourceInput.value=currentSource;
      sourceError.textContent='';
      sourceDialog.hidden=false;
      sourceInput.focus();
    };
    const closeSourceDialog=()=>{sourceDialog.hidden=true};
    const cancelLongPress=()=>{clearTimeout(longPressTimer);longPressTimer=null};
    addressCard.addEventListener('pointerdown',()=>{
      longPressTriggered=false;
      longPressTimer=setTimeout(()=>{
        longPressTriggered=true;
        openSourceDialog();
      },600);
    });
    ['pointerup','pointercancel','pointerleave'].forEach(type=>addressCard.addEventListener(type,cancelLongPress));
    addressCard.addEventListener('contextmenu',event=>event.preventDefault());
    addressCard.addEventListener('click',event=>{if(longPressTriggered){event.preventDefault();longPressTriggered=false}});
    sourceCancel.addEventListener('click',closeSourceDialog);
    sourceDialog.addEventListener('click',event=>{if(event.target===sourceDialog) closeSourceDialog()});
    sourceForm.addEventListener('submit',event=>{
      event.preventDefault();
      const value=sourceInput.value.trim();
      if(!/^[A-Za-z0-9_-]{1,64}$/.test(value)){
        sourceError.textContent='请输入 1–64 位字母、数字、短横线或下划线。';
        sourceInput.focus();
        return;
      }
      currentSource=value;
      updateQr(currentSource);
      closeSourceDialog();
      setPromoOpen(true);
    });
    const downloadButton=document.getElementById('downloadCard');
    const waitForImages=async root=>{
      const images=[...root.querySelectorAll('img')];
      await Promise.all(images.map(image=>image.complete ? Promise.resolve() : new Promise(resolve=>{
        image.addEventListener('load',resolve,{once:true});
        image.addEventListener('error',resolve,{once:true});
      })));
      await Promise.all(images.map(image=>image.decode?.().catch(()=>{})));
    };
    const downloadPdf=async()=>{
      if(!window.html2canvas||!window.jspdf?.jsPDF){window.print();return}
      downloadButton.disabled=true;
      downloadButton.setAttribute('aria-busy','true');
      try{
        await document.fonts?.ready;
        await waitForImages(promoFold);
        const canvas=await window.html2canvas(promoFold.querySelector('.promo-card'),{
          backgroundColor:null,
          scale:Math.min(4,Math.max(3,window.devicePixelRatio||1)),
          useCORS:true,
          imageTimeout:15000,
          logging:false,
          ignoreElements:element=>element.classList?.contains('download')
        });
        const dpi=300, millimetersPerInch=25.4, trimWidth=85.6, trimHeight=53.98, bleed=3;
        const mmToPixels=millimeters=>Math.round(millimeters/millimetersPerInch*dpi);
        const trimPixels={width:mmToPixels(trimWidth),height:mmToPixels(trimHeight)};
        const bleedPixels=mmToPixels(bleed);
        const pressCanvas=document.createElement('canvas');
        pressCanvas.width=trimPixels.width+bleedPixels*2;
        pressCanvas.height=trimPixels.height+bleedPixels*2;
        const pressContext=pressCanvas.getContext('2d');
        const gradientAngle=145*Math.PI/180;
        const gradientDirection={x:Math.sin(gradientAngle),y:-Math.cos(gradientAngle)};
        const gradientLength=Math.abs(trimPixels.width*gradientDirection.x)+Math.abs(trimPixels.height*gradientDirection.y);
        const gradientCenter={x:pressCanvas.width/2,y:pressCanvas.height/2};
        const bleedGradient=pressContext.createLinearGradient(
          gradientCenter.x-gradientDirection.x*gradientLength/2,
          gradientCenter.y-gradientDirection.y*gradientLength/2,
          gradientCenter.x+gradientDirection.x*gradientLength/2,
          gradientCenter.y+gradientDirection.y*gradientLength/2
        );
        bleedGradient.addColorStop(0,'#2b2723');
        bleedGradient.addColorStop(1,'#1e1b18');
        pressContext.fillStyle=bleedGradient;
        pressContext.fillRect(0,0,pressCanvas.width,pressCanvas.height);
        pressContext.drawImage(canvas,bleedPixels,bleedPixels,trimPixels.width,trimPixels.height);
        const {jsPDF}=window.jspdf;
        const pageWidth=trimWidth+bleed*2, pageHeight=trimHeight+bleed*2;
        const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:[pageWidth,pageHeight],compress:true});
        pdf.addImage(pressCanvas.toDataURL('image/png'),'PNG',0,0,pageWidth,pageHeight,undefined,'FAST');
        pdf.setDrawColor(0,0,0);
        pdf.setLineWidth(.1);
        const cropLength=4, cropOffset=1;
        [[bleed,bleed],[pageWidth-bleed,bleed],[bleed,pageHeight-bleed],[pageWidth-bleed,pageHeight-bleed]].forEach(([x,y],index)=>{
          const horizontalDirection=index%2===0?-1:1;
          const verticalDirection=index<2?-1:1;
          pdf.line(x+horizontalDirection*cropOffset,y,x+horizontalDirection*(cropOffset+cropLength),y);
          pdf.line(x,y+verticalDirection*cropOffset,x,y+verticalDirection*(cropOffset+cropLength));
        });
        pdf.save(`surabbit-promo-card${currentSource?`-${currentSource}`:''}.pdf`);
      }catch(error){
        console.error('Unable to generate the promotional card PDF.',error);
        window.print();
      }finally{
        downloadButton.disabled=false;
        downloadButton.removeAttribute('aria-busy');
      }
    };
    downloadButton.addEventListener('click',downloadPdf);
  </script>

</body>
</html>
