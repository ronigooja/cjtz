<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff5eb" />
  <meta name="description" content="超级兔子地址发布页" />
  <title>超级兔子 · 地址发布页</title>
  <style>
    :root {
      --ink: #262626;
      --muted: #6f6f6f;
      --orange: #f38020;
      --orange-deep: #d96612;
      --orange-soft: #fff0e3;
      --line: rgba(255, 255, 255, .86);
      --glass: rgba(255, 255, 255, .7);
      --shadow: 0 30px 90px rgba(120, 67, 25, .15);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 4% 0%, rgba(255, 190, 126, .42), transparent 28%),
        radial-gradient(circle at 100% 10%, rgba(255, 226, 193, .58), transparent 25%),
        linear-gradient(145deg, #fff5eb 0%, #fffdf9 54%, #fff1e4 100%);
      overflow-x: hidden;
    }

    body::before, body::after {
      position: fixed;
      z-index: -1;
      display: block;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      content: "";
      filter: blur(2px);
      opacity: .4;
      pointer-events: none;
    }
    body::before { top: 42%; left: -150px; background: #ffd4aa; }
    body::after { right: -150px; bottom: 4%; background: #f5bd83; }

    .page {
      width: min(100% - 32px, 520px);
      margin: 0 auto;
      padding: 30px 0 28px;
    }

    .shell {
      position: relative;
      overflow: hidden;
      padding: 22px 18px 20px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 34px;
      background: linear-gradient(150deg, rgba(255,255,255,.57), rgba(255,255,255,.3));
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px) saturate(130%);
      -webkit-backdrop-filter: blur(22px) saturate(130%);
    }
    .shell::before {
      position: absolute;
      top: -78px;
      right: -52px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .48);
      content: "";
    }

    header { position: relative; text-align: center; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 18px;
      padding: 7px 11px;
      border: 1px solid rgba(243, 128, 32, .18);
      border-radius: 999px;
      color: var(--orange-deep);
      background: rgba(255,255,255,.48);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .eyebrow::before { width: 6px; height: 6px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 4px rgba(243,128,32,.14); content: ""; }
    .logo-wrap {
      display: grid;
      place-items: center;
      width: 86px;
      height: 86px;
      margin: 0 auto 19px;
      border: 5px solid rgba(255,255,255,.86);
      border-radius: 28px;
      background: rgba(255,255,255,.52);
      box-shadow: 0 17px 36px rgba(180, 91, 24, .2), 0 0 0 8px rgba(255,255,255,.2);
    }
    .logo {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 21px;
      object-fit: cover;
    }
    h1 { margin: 0; font-size: clamp(25px, 7vw, 32px); font-weight: 750; letter-spacing: .015em; }
    .subtitle { margin: 10px 0 0; color: var(--muted); font-size: 13px; letter-spacing: .16em; }

    .address-list { display: grid; gap: 13px; margin: 32px 0 25px; }
    .address-card {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 78px;
      padding: 13px 13px 13px 15px;
      border: 1px solid rgba(255,255,255,.78);
      border-radius: 20px;
      color: inherit;
      text-decoration: none;
      background: linear-gradient(110deg, rgba(255,255,255,.79), rgba(255,255,255,.47));
      box-shadow: 0 12px 26px rgba(53, 129, 113, .075), inset 0 1px 0 rgba(255,255,255,.72);
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .address-card:active { transform: scale(.985); }
    @media (hover: hover) {
      .address-card:hover { transform: translateY(-2px); background: rgba(255,255,255,.82); box-shadow: 0 14px 28px rgba(53,129,113,.13); }
    }
    .site-icon {
      display: grid;
      flex: 0 0 43px;
      place-items: center;
      width: 45px;
      height: 45px;
      border-radius: 15px;
      color: white;
      font-weight: 700;
      background: linear-gradient(140deg, #ffb36f, #f38020);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.42), 0 7px 15px rgba(243,128,32,.24);
    }
    .address-info { min-width: 0; flex: 1; }
    .address-label { margin-bottom: 5px; color: var(--muted); font-size: 11px; letter-spacing: .05em; }
    .address-url { overflow: hidden; color: var(--ink); font-size: 15px; font-weight: 650; letter-spacing: -.01em; text-overflow: ellipsis; white-space: nowrap; }
    .arrow { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: var(--orange-deep); background: rgba(243,128,32,.12); font-size: 22px; font-weight: 300; line-height: 1; }

    .tip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .tip-dot { width: 6px; height: 6px; border-radius: 99px; background: var(--orange); }
    footer { margin-top: 29px; color: rgba(86, 68, 55, .68); font-size: 10px; text-align: center; letter-spacing: .18em; text-transform: uppercase; }

    @media (min-width: 600px) {
      .page { padding-top: 72px; }
      .shell { padding: 28px 34px 26px; }
    }
    @media (prefers-reduced-motion: reduce) { .address-card { transition: none; } }

    .card-fold { margin-top: 22px; }
    .card-fold summary { display:flex; align-items:center; justify-content:center; min-height:44px; padding:11px 16px; border:1px solid rgba(255,255,255,.82); border-radius:14px; color:var(--orange-deep); background:rgba(255,255,255,.48); box-shadow:0 8px 18px rgba(120,67,25,.08); cursor:pointer; font-size:12px; font-weight:700; list-style:none; }
    .card-fold summary::-webkit-details-marker { display:none; }
    .card-fold summary::after { margin-left:8px; content:"⌄"; font-size:18px; line-height:1; }
    .card-fold[open] summary::after { transform:rotate(180deg); }
    .promo-card { position:relative; aspect-ratio:85.6/53.98; margin-top:12px; padding:6.2% 6.6%; border:1px solid rgba(106,58,20,.13); border-radius:20px; background:radial-gradient(circle at 90% 0%,#ffe0bb 0,transparent 34%),linear-gradient(135deg,#fffaf2,#fff 62%,#fff0df); box-shadow:0 18px 38px rgba(54,29,12,.18); overflow:hidden; }
    .promo-card::before { position:absolute; right:-55px; bottom:-80px; width:230px; height:230px; border-radius:50%; background:rgba(247,145,67,.13); content:""; }
    .promo-top { position:relative; display:flex; align-items:center; gap:10px; }
    .promo-logo { width:16%; aspect-ratio:1; border-radius:24%; object-fit:cover; }
    .promo-brand { font-size:clamp(16px,4.8vw,25px); font-weight:850; }
    .promo-vpn { margin-top:2px; color:var(--orange-deep); font-size:clamp(9px,2.6vw,14px); font-weight:850; letter-spacing:.2em; }
    .promo-tagline { position:relative; margin-top:5.5%; font-size:clamp(13px,3.8vw,21px); font-weight:850; letter-spacing:.06em; }
    .promo-desc { position:relative; margin-top:2.5%; color:#66574c; font-size:clamp(8px,2.2vw,12px); font-weight:650; }
    .icon-grid { position:absolute; left:6.6%; bottom:14%; display:grid; grid-template-columns:repeat(3,1fr); gap:7px; width:29%; }
    .icon-grid img { display:block; width:100%; aspect-ratio:1; border-radius:22%; background:#fff; box-shadow:0 4px 10px rgba(64,41,23,.1); }
    .qr-wrap { position:absolute; right:7.2%; bottom:10%; display:grid; gap:4px; justify-items:center; padding:6px; border-radius:9px; background:#fff; box-shadow:0 7px 16px rgba(84,49,19,.13); }
    .qr-wrap img { display:block; width:clamp(48px,17vw,83px); aspect-ratio:1; }
    .qr-caption { color:var(--orange-deep); font-size:clamp(7px,1.9vw,10px); font-weight:800; white-space:nowrap; }
    .promo-url,.promo-tg { position:absolute; bottom:4%; color:#5b4b40; font-size:clamp(7px,1.8vw,10px); font-weight:700; }
    .promo-url { right:7.2%; } .promo-tg { left:6.6%; color:#76685c; font-weight:650; }
    .download { position:absolute; top:10px; right:10px; display:grid; place-items:center; width:34px; height:34px; border:0; border-radius:50%; color:#fff; background:var(--orange); box-shadow:0 8px 18px rgba(201,92,13,.25); cursor:pointer; }
    .download svg { width:17px; height:17px; }

  </style>
</head>
<body>
  <main class="page">
    <section class="shell" aria-labelledby="page-title">
      <header>
        <div class="eyebrow">Official access</div>
        <div class="logo-wrap">
          <img class="logo" src="https://surabbit.com/usr/uploads/2026/09/3055456685.jpg" alt="超级兔子 logo" />
        </div>
        <h1 id="page-title">超级兔子</h1>
        <p class="subtitle">最新地址发布页</p>
      </header>

      <!-- 后续新增地址时，复制一个 .address-card 并修改 href、label 与 URL 即可 -->
      <nav class="address-list" aria-label="网站地址列表">
        <div class="address-entry">
          <a class="address-card" href="https://surabbit.com" target="_blank" rel="noopener noreferrer">
            <span class="site-icon" aria-hidden="true">S</span>
            <span class="address-info">
              <span class="address-label">主站地址</span>
              <span class="address-url">https://surabbit.com</span>
            </span>
            <span class="arrow" aria-hidden="true">›</span>
          </a>

          <details class="card-fold" id="promoFold">
            <div class="promo-card" aria-label="超级兔子宣传卡片">
              <div class="promo-top"><img class="promo-logo" src="https://surabbit.com/usr/uploads/2026/09/3055456685.jpg" alt="超级兔子 logo" /><div><div class="promo-brand">超级兔子</div><div class="promo-vpn">VPN</div></div></div>
              <div class="promo-tagline">畅享全球内容</div><div class="promo-desc">AI 工具 · 流媒体 · 跨境电商</div>
              <div class="icon-grid"><img src="assets/img/chatgpt.png" alt="ChatGPT" /><img src="assets/img/claude.png" alt="Claude" /><img src="assets/img/google.png" alt="Google" /><img src="assets/img/instagram.png" alt="Instagram" /><img src="assets/img/netflix.png" alt="Netflix" /><img src="assets/img/shopify.png" alt="Shopify" /><img src="assets/img/tiktok.png" alt="TikTok" /><img src="assets/img/x.png" alt="X" /><img src="assets/img/youtube.png" alt="YouTube" /></div>
              <div class="qr-wrap"><img id="qrImage" alt="官网二维码" /><span class="qr-caption">扫码访问官网</span></div><div class="promo-tg">Telegram：@cjtzpd</div><div class="promo-url">surabbit.com</div>
              <button class="download" id="downloadCard" type="button" aria-label="下载宣传卡片" title="下载宣传卡片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
            </div>
          </details>
        </div>
      </nav>

      <p class="tip"><span class="tip-dot" aria-hidden="true"></span>点击卡片即可访问，请收藏本页面</p>
      <footer>Keep it simple · Stay connected</footer>
    </section>
  </main>
  <script>
    const address='https://surabbit.com', qrImage=document.getElementById('qrImage');
    qrImage.src='https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=0&data='+encodeURIComponent(address);
    const addressCard=document.querySelector('.address-card'), promoFold=document.getElementById('promoFold');
    let longPressTimer, longPressTriggered=false;
    const cancelLongPress=()=>{clearTimeout(longPressTimer);longPressTimer=null};
    addressCard.addEventListener('pointerdown',()=>{
      longPressTriggered=false;
      longPressTimer=setTimeout(()=>{longPressTriggered=true;promoFold.open=!promoFold.open},600);
    });
    ['pointerup','pointercancel','pointerleave'].forEach(type=>addressCard.addEventListener(type,cancelLongPress));
    addressCard.addEventListener('contextmenu',event=>event.preventDefault());
    addressCard.addEventListener('click',event=>{if(longPressTriggered){event.preventDefault();longPressTriggered=false}});
    document.getElementById('downloadCard').addEventListener('click',()=>{const svg='<svg xmlns="http://www.w3.org/2000/svg" width="1011" height="638" viewBox="0 0 1011 638"><rect width="1011" height="638" rx="30" fill="#fffaf2"/><text x="68" y="105" font-family="Arial,sans-serif" font-size="52" font-weight="800" fill="#28221e">超级兔子</text><text x="70" y="140" font-family="Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="6" fill="#c95c0d">VPN</text><text x="68" y="220" font-family="Arial,sans-serif" font-size="43" font-weight="800" fill="#28221e">畅享全球内容</text><text x="68" y="263" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#66574c">AI 工具 · 流媒体 · 跨境电商</text><image href="'+qrImage.src+'" x="780" y="340" width="155" height="155"/><text x="803" y="520" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#c95c0d">扫码访问官网</text><text x="70" y="572" font-family="Arial,sans-serif" font-size="19" fill="#76685c">Telegram：@cjtzpd</text><text x="790" y="590" font-family="Arial,sans-serif" font-size="19" fill="#5b4b40">surabbit.com</text></svg>';const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='super-rabbit-card.svg';link.click();URL.revokeObjectURL(link.href)});
  </script>

</body>
</html>
