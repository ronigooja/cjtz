<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eff9f6" />
  <meta name="description" content="超级兔子地址发布页" />
  <title>超级兔子 · 地址发布页</title>
  <style>
    :root {
      --ink: #123b3a;
      --muted: #76908c;
      --mint: #65c7ad;
      --mint-deep: #238f7b;
      --line: rgba(255, 255, 255, .8);
      --glass: rgba(255, 255, 255, .6);
      --shadow: 0 30px 90px rgba(35, 112, 96, .15);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 4% 0%, rgba(145, 231, 205, .7), transparent 27%),
        radial-gradient(circle at 100% 10%, rgba(255, 217, 164, .48), transparent 25%),
        linear-gradient(145deg, #eaf8f3 0%, #fbfcf8 54%, #eff9f4 100%);
      overflow-x: hidden;
    }

    body::before, body::after {
      position: fixed;
      z-index: -1;
      display: block;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      content: "";
      filter: blur(2px);
      opacity: .4;
      pointer-events: none;
    }
    body::before { top: 42%; left: -150px; background: #bbead8; }
    body::after { right: -150px; bottom: 4%; background: #f9dfad; }

    .page {
      width: min(100% - 32px, 520px);
      margin: 0 auto;
      padding: 30px 0 28px;
    }

    .shell {
      position: relative;
      overflow: hidden;
      padding: 22px 18px 20px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 34px;
      background: linear-gradient(150deg, rgba(255,255,255,.57), rgba(255,255,255,.3));
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px) saturate(130%);
      -webkit-backdrop-filter: blur(22px) saturate(130%);
    }
    .shell::before {
      position: absolute;
      top: -78px;
      right: -52px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .48);
      content: "";
    }

    header { position: relative; text-align: center; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 18px;
      padding: 7px 11px;
      border: 1px solid rgba(47, 154, 130, .15);
      border-radius: 999px;
      color: var(--mint-deep);
      background: rgba(255,255,255,.48);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .eyebrow::before { width: 6px; height: 6px; border-radius: 50%; background: #52c69d; box-shadow: 0 0 0 4px rgba(82,198,157,.14); content: ""; }
    .logo-wrap {
      display: grid;
      place-items: center;
      width: 86px;
      height: 86px;
      margin: 0 auto 19px;
      border: 5px solid rgba(255,255,255,.86);
      border-radius: 28px;
      background: rgba(255,255,255,.52);
      box-shadow: 0 17px 36px rgba(44, 140, 121, .2), 0 0 0 8px rgba(255,255,255,.2);
    }
    .logo {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 21px;
      object-fit: cover;
    }
    h1 { margin: 0; font-size: clamp(25px, 7vw, 32px); font-weight: 750; letter-spacing: .015em; }
    .subtitle { margin: 10px 0 0; color: var(--muted); font-size: 13px; letter-spacing: .16em; }

    .address-list { display: grid; gap: 13px; margin: 32px 0 25px; }
    .address-card {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 78px;
      padding: 13px 13px 13px 15px;
      border: 1px solid rgba(255,255,255,.78);
      border-radius: 20px;
      color: inherit;
      text-decoration: none;
      background: linear-gradient(110deg, rgba(255,255,255,.79), rgba(255,255,255,.47));
      box-shadow: 0 12px 26px rgba(53, 129, 113, .075), inset 0 1px 0 rgba(255,255,255,.72);
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .address-card:active { transform: scale(.985); }
    @media (hover: hover) {
      .address-card:hover { transform: translateY(-2px); background: rgba(255,255,255,.82); box-shadow: 0 14px 28px rgba(53,129,113,.13); }
    }
    .site-icon {
      display: grid;
      flex: 0 0 43px;
      place-items: center;
      width: 45px;
      height: 45px;
      border-radius: 15px;
      color: white;
      font-weight: 700;
      background: linear-gradient(140deg, #a8ead7, #3eaa94);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.42), 0 7px 15px rgba(48,157,137,.2);
    }
    .address-info { min-width: 0; flex: 1; }
    .address-label { margin-bottom: 5px; color: var(--muted); font-size: 11px; letter-spacing: .05em; }
    .address-url { overflow: hidden; color: var(--ink); font-size: 15px; font-weight: 650; letter-spacing: -.01em; text-overflow: ellipsis; white-space: nowrap; }
    .arrow { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: var(--mint-deep); background: rgba(102,199,174,.12); font-size: 22px; font-weight: 300; line-height: 1; }

    .tip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .tip-dot { width: 6px; height: 6px; border-radius: 99px; background: var(--mint); }
    footer { margin-top: 29px; color: rgba(67, 110, 101, .58); font-size: 10px; text-align: center; letter-spacing: .18em; text-transform: uppercase; }

    @media (min-width: 600px) {
      .page { padding-top: 72px; }
      .shell { padding: 28px 34px 26px; }
    }
    @media (prefers-reduced-motion: reduce) { .address-card { transition: none; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="shell" aria-labelledby="page-title">
      <header>
        <div class="eyebrow">Official access</div>
        <div class="logo-wrap">
          <img class="logo" src="https://surabbit.com/usr/uploads/2026/09/3055456685.jpg" alt="超级兔子 logo" />
        </div>
        <h1 id="page-title">超级兔子</h1>
        <p class="subtitle">最新地址发布页</p>
      </header>

      <!-- 后续新增地址时，复制一个 .address-card 并修改 href、label 与 URL 即可 -->
      <nav class="address-list" aria-label="网站地址列表">
        <a class="address-card" href="https://surabbit.com" target="_blank" rel="noopener noreferrer">
          <span class="site-icon" aria-hidden="true">S</span>
          <span class="address-info">
            <span class="address-label">主站地址</span>
            <span class="address-url">https://surabbit.com</span>
          </span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>
      </nav>

      <p class="tip"><span class="tip-dot" aria-hidden="true"></span>点击卡片即可访问，请收藏本页面</p>
      <footer>Keep it simple · Stay connected</footer>
    </section>
  </main>
</body>
</html>
